name: Android

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test
        run: ./gradlew :nga_phone_base_3.0:assembleDebug lint test --stacktrace
      - name: Secret scan
        run: ./scripts/secret-scan.sh

# Hosted CI intentionally does not start emulators. Device validation uses an
# exact ANDROID_SERIAL on a developer-provided device, with this runtime matrix:
# API 30 minimum-install smoke, API 35 primary gate, and API 36 forward
# compatibility reported as target35-on-api36.
