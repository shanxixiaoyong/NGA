name: Build Artifacts

on:
  push:
    branches: [main]
    tags: ["*.*.*"]
    paths-ignore:
      - ".trellis/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-cleanup: on-success

      - name: Restore release keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nga-just-works-release.p12"
          chmod 600 "$RUNNER_TEMP/nga-just-works-release.p12"

      - name: Build signed release APK
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/nga-just-works-release.p12
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :nga_phone_base_3.0:assembleRelease --no-daemon

      - name: Verify and stage APK
        run: |
          set -euo pipefail
          app_version="$(./gradlew -q printAppVersion --no-daemon --console=plain | tail -n 1)"
          test "$app_version" = "4.3.0"
          source_apk="$(find nga_phone_base_3.0/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)"
          test -n "$source_apk"
          mkdir -p dist
          release_apk="dist/NGA-Just-Works-${app_version}.apk"
          cp "$source_apk" "$release_apk"
          test "$(apkanalyzer manifest application-id "$release_apk")" = "com.github.tophtab.ngajustworks"
          test "$(apkanalyzer manifest version-name "$release_apk")" = "$app_version"
          test "$(apkanalyzer manifest version-code "$release_apk")" = "4030"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$release_apk"
          (cd dist && sha256sum "$(basename "$release_apk")" > "$(basename "$release_apk").sha256")

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: NGA-Just-Works-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Find successful main build
        id: main-build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_run_id="$(
            gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$GITHUB_SHA" \
              -f status=success \
              -F per_page=100 \
              --jq '.workflow_runs | sort_by(.run_number) | last | .id // empty'
          )"
          test -n "$main_run_id"
          printf 'run_id=%s\n' "$main_run_id" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=NGA-Just-Works-%s\n' "$main_run_id" >> "$GITHUB_OUTPUT"

      - name: Download signed release APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.main-build.outputs.artifact_name }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.main-build.outputs.run_id }}
          path: dist

      - name: Verify release files
        run: |
          set -euo pipefail
          release_apk="dist/NGA-Just-Works-${GITHUB_REF_NAME}.apk"
          checksum_file="${release_apk}.sha256"
          test -f "$release_apk"
          test -f "$checksum_file"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          (cd dist && sha256sum -c "$(basename "$checksum_file")")

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "NGA Just Works $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
