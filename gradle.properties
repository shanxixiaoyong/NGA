## Project-wide Gradle settings.
#
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# Run tasks from different subprojects concurrently. Gradle 8.7 executes one
# task at a time by default; the parallel limit follows org.gradle.workers.max.
# Measured off/on on the CI runner that builds releases (4 vCPU), paired on one
# runner: median 232.32s off vs 227.50s on. That -2.1% sits inside run-to-run
# noise, so this is enabled as "not a regression", not as a proven speedup.
# The release build is dominated by the single non-parallelizable
# :nga_phone_base_3.0:minifyReleaseWithR8 task (~70% of the build), which
# parallel execution cannot split. Expect this setting to matter more as the
# module graph grows.
#Tue Aug 22 08:32:17 CST 2017
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false
android.injected.testOnly=false
android.useAndroidX=true
android.enableJetifier=true
android.nonFinalResIds=false
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=false
